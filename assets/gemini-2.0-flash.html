<!doctypehtml><title>Gemini 2.0 Flash</title><meta name="viewport"content="width=device-width,initial-scale=1.0,user-scalable=no;user-scalable=0;"><meta charset="UTF-8"><style>html{-webkit-text-size-adjust:100%;}pre{white-space:pre-wrap;word-wrap:break-word;color:gray}form{width:100%;margin:0;display:flex}textarea{resize:none;flex-grow:1;padding:10px;background-color:#151515;color:#a0b0c0;border:1px solid gray;border-radius:5px}textarea:focus{outline:none}button{padding:10px;background-color:#151515;color:#a0b0c0;margin-left:10px;border:1px solid gray;font-size:24px;border-radius:5px}h1{margin-bottom:0;padding-bottom:0}body{background-color:#151515;color:#a0b0c0}</style><h1>Gemini 2.0 Flash</h1><pre><i>site shamelessly generated by AI</i></pre><div id=chat-output></div><br><form id=chat-form><textarea autocomplete=off id=prompt name=prompt placeholder="Ask something"required></textarea><button type=submit>⟩</button></form>
<script type="module">
    import * as googlegenerativeAi from 'https://esm.run/@google/generative-ai';
    const API_KEY=localStorage.getItem("APIKEY"),MODEL_NAME="gemini-1.5-flash",chatForm=document.getElementById("chat-form"),chatOutput=document.getElementById("chat-output");
    let chatHistory=[];
    const genAI = new googlegenerativeAi.GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({
            model: MODEL_NAME,
        });
    const generationConfig = {
            temperature: 1,
            topP: 0.95,
            topK: 64,
            maxOutputTokens: 8192,
            responseMimeType: "text/plain",
    };
    const chatSession = model.startChat({
            generationConfig,
            history: [],
        });
    async function getGeminiResponse(t){
            try{
                    const result = await chatSession.sendMessage(t);
                    console.log(result);
                    console.log(result.response);
                    return result.response;
                }catch(r){return console.error("Error fetching data:",r),null;}
        }
    function clean(t){return t.replaceAll("<","&lt;").replaceAll(">","&gt;")}
    function simpleMarkdownFormatter(t){if("string"!=typeof t)return"";let e=t;return(e=(e=(e=e.replace(/\n/g,"<br>")).split("<br>").map(t=>{let e=t.match(/^(\s*)/)[1];if(t.trimStart().startsWith("* ")){let r;return`<span style="white-space:pre-wrap;word-wrap:break-word;">${e.replace(/ /g," ")}- ${t.trimStart().substring(2)}</span>`}return t}).join("<br>")).replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")).replace(/\*(.*?)\*/g,"<i>$1</i>")}
    function generateChatHTML(t){
        let e="";
        for(let r of t)
            "user"===r.role?
                e+=`<div><p><b>You</b><br>${clean(r.parts[0].text).replaceAll("\n","<br>")}</p></div>`:
                //"model"===r.role&&(e+=`<div><p><b>Gemini</b><br><pre><i>${clean(r.parts[0].text).replaceAll("\n","<br>")}</i></pre></p><span style="white-space:pre-wrap;word-wrap:break-word;">${simpleMarkdownFormatter(clean(r.parts[1].text))}</span></div>`);
                "model"===r.role&&(e+=`<div><p><b>Gemini</b><br></p><span style="white-space:pre-wrap;word-wrap:break-word;">${simpleMarkdownFormatter(clean(r.parts[0].text))}</span></div>`);
        return e;
    }
    async function run(){
        let e=document.getElementById("prompt").value;
        if(e=="SETKEY"){API_KEY=prompt("enter API key");localStorage.setItem("APIKEY",API_KEY);document.getElementById("prompt").value="";return;}
        else if(e=="ERASE"){chatOutput.innerHTML="";document.getElementById("prompt").value="";return;};
        chatHistory.push({parts:[{text:e}],role:"user"});
        chatOutput.innerHTML=generateChatHTML(chatHistory)
        document.getElementById("prompt").value="";
        try{
            let r=await getGeminiResponse(e);
            if(r&&r.candidates&&r.candidates.length>0&&r.candidates[0].content&&r.candidates[0].content.parts){
                let a=r.candidates[0].content.parts[0].text;
                //n=r.candidates[0].content.parts[1].text;
                chatHistory.push({parts:[{text:a}/*,{text:n}*/],role:"model"});
                chatOutput.innerHTML=generateChatHTML(chatHistory);
            }else chatOutput.innerHTML+="<p>Error: Could not retrieve a valid response format. You may not have correctly set your API key. Do so by entering `SETKEY`.</p>"}catch(i){chatOutput.innerHTML+="<p>Error: Could not receive a response from Gemini: "+i+".</p>"}
    }
        chatForm.addEventListener("submit",t=>{t.preventDefault();run();});document.getElementById('prompt').addEventListener('keydown',function(event){if(event.key==='Enter'&&event.ctrlKey){event.preventDefault();run();}});
</script>
